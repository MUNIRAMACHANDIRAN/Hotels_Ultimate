
<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>
</head>
<body class="p-3">
<h3>Admin Dashboard</h3>
<button onclick="toggleDark()">🌙</button>
<canvas id="chart"></canvas>
<div id="calendar"></div>
<script>
function toggleDark(){document.body.classList.toggle("bg-dark");document.body.classList.toggle("text-white");}
fetch("/api/bookings/stats").then(r=>r.json()).then(d=>{
new Chart(chart,{type:"bar",data:{labels:d.map(x=>x.m),datasets:[{data:d.map(x=>x.t)}]}});
});
new FullCalendar.Calendar(calendar,{initialView:"dayGridMonth"}).render();
</script>
</body>
</html>
