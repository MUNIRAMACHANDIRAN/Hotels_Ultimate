<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">

  <style>
    body { background:#f4f6f9; }
    .card { border-radius:12px; }
    .sidebar {
      min-height: 100vh;
      background: #212529;
      color: white;
    }
    .sidebar a {
      color: white;
      text-decoration: none;
      display: block;
      padding: 12px;
    }
    .sidebar a:hover {
      background: #343a40;
    }
  </style>
</head>

<body>
<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <div class="col-md-2 sidebar">
      <h4 class="p-3">🏨 Hotel Admin</h4>
      <a href="#">Dashboard</a>
      <a href="#booking">Bookings</a>
      <a href="#calendar">Calendar</a>
      <a href="#">Logout</a>
    </div>

    <!-- Main -->
    <div class="col-md-10 p-4">

      <!-- Cards -->
      <div class="row mb-4">
        <div class="col-md-4">
          <div class="card p-3 text-center shadow">
            <h6>Total Bookings</h6>
            <h2 id="totalBookings">0</h2>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card p-3 text-center shadow">
            <h6>Total Rooms</h6>
            <h2>50</h2>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card p-3 text-center shadow">
            <h6>Available Rooms</h6>
            <h2>20</h2>
          </div>
        </div>
      </div>

      <!-- Booking Form -->
      <div class="card p-4 mb-4 shadow" id="booking">
        <h5>Add / Update Booking</h5>
        <input id="guest" class="form-control mb-2" placeholder="Guest Name">
        <input id="room" class="form-control mb-2" placeholder="Room Number">
        <button class="btn btn-success" onclick="save()">Save Booking</button>
      </div>

      <!-- Booking List -->
      <div class="card p-4 mb-4 shadow">
        <h5>Bookings</h5>
        <ul id="list" class="list-group"></ul>
      </div>

      <!-- Calendar -->
      <div class="card p-4 shadow" id="calendar">
        <h5>Room Booking Calendar</h5>
        <div id="calendarView"></div>
      </div>

    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>

<script>
let editId = null;

// Load bookings
function load() {
  fetch("/api/bookings")
    .then(res => res.json())
    .then(data => {
      document.getElementById("totalBookings").innerText = data.length;

      list.innerHTML = data.map(b => `
        <li class="list-group-item d-flex justify-content-between align-items-center">
          ${b.guest} (Room ${b.room})
          <div>
            <button class="btn btn-sm btn-warning me-2" onclick="edit(${b.id})">Edit</button>
            <button class="btn btn-sm btn-danger" onclick="del(${b.id})">Delete</button>
          </div>
        </li>
      `).join("");

      loadCalendar(data);
    });
}

// Save booking
function save() {
  const payload = { guest: guest.value, room: room.value };

  if (editId) {
    fetch("/api/bookings/" + editId, {
      method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    }).then(() => { editId = null; load(); });
  } else {
    fetch("/api/bookings", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    }).then(load);
  }

  guest.value = "";
  room.value = "";
}

function edit(id) {
  fetch("/api/bookings")
    .then(res => res.json())
    .then(data => {
      const b = data.find(x => x.id === id);
      guest.value = b.guest;
      room.value = b.room;
      editId = id;
    });
}

function del(id) {
  if(confirm("Delete this booking?")){
    fetch("/api/bookings/" + id, {method:"DELETE"}).then(load);
  }
}

// Calendar
function loadCalendar(data) {
  const events = data.map(b => ({
    title: `${b.guest} (Room ${b.room})`,
    start: new Date()
  }));

  const calendarEl = document.getElementById('calendarView');
  calendarEl.innerHTML = "";

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    events: events
  });

  calendar.render();
}

load();
</script>
</body>
</html>
