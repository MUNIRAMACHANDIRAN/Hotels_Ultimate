
<!DOCTYPE html>
<html>
<head>
<title>Hotel Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
<div class="card p-4 col-md-4 mx-auto">
<h4>Login</h4>
<input id="u" class="form-control mb-2" placeholder="Username">
<input id="p" type="password" class="form-control mb-2" placeholder="Password">
<button class="btn btn-primary w-100" onclick="login()">Login</button>
</div>
<script>
function login(){
fetch("/api/auth/login",{method:"POST",headers:{'Content-Type':'application/json'},
body:JSON.stringify({username:u.value,password:p.value})})
.then(r=>r.json()).then(d=>{
if(d.role==="admin") location.href="/admin/dashboard.html";
else location.href="/staff/dashboard.html";
});
}
</script>
</body>
</html>
